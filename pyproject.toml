[project]
name = "agentic-cloud-optimizer"
version = "0.1.0"
description = "Observe Kubernetes workloads and recommend human-approved resource changes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161",
    "httpx2>=2.16",
    "kubernetes>=37",
    "openai>=3.42",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "uvicorn>=0.54",
]

[project.optional-dependencies]
dev = ["pytest>=9.1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optimizer", "src/dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
